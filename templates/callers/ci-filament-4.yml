name: CI / Filament 4

on:
  push:
    branches:
      - 4.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - 4.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"

# LEGACY BRANCH ONLY.
#
# Packages normally serve every supported Filament major from one branch and get a single
# ci.yml (see ci-filament.yml). This file is for the exception: a frozen branch kept alive
# for an older major after the active branch has moved on — e.g. curator's 4.x.
#
# Because its `on:` is scoped to that branch, merging it forward is harmless; it will not
# run on the newer branch. Adjust the branch name and the matrix to whatever the frozen
# branch actually supports.
jobs:
  ci:
    uses: awcodes/.github/.github/workflows/filament-plugin.yml@v1
    with:
      matrix: |
        [
          {"php":"8.4","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.3","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"}
        ]
      run-tests: true
      run-lint: true
      run-static-analysis: false
      run-reformat: true
      run-build: false
