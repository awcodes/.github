name: PHP Library CI

on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON array of explicit matrix rows (php, dependencies)."
        type: string
        required: true
      run-tests:
        type: boolean
        default: true
      run-lint:
        type: boolean
        default: true
      run-static-analysis:
        type: boolean
        default: true
      run-reformat:
        type: boolean
        default: true
      php-version:
        description: "PHP version for the single-version Lint / Static Analysis / Reformat jobs."
        type: string
        default: "8.4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP
        uses: awcodes/.github/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        uses: awcodes/.github/actions/install-dependencies@v1
        with:
          dependency-version: ${{ matrix.dependencies }}
      - name: Run tests
        run: vendor/bin/pest --parallel

  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: awcodes/.github/actions/setup-php@v1
        with:
          php-version: ${{ inputs.php-version }}
      - uses: awcodes/.github/actions/install-dependencies@v1
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis
    if: ${{ inputs.run-static-analysis }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: awcodes/.github/actions/setup-php@v1
        with:
          php-version: ${{ inputs.php-version }}
      - uses: awcodes/.github/actions/install-dependencies@v1
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  reformat:
    name: Reformat
    if: ${{ inputs.run-reformat }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: awcodes/.github/actions/setup-php@v1
        with:
          php-version: ${{ inputs.php-version }}
      - uses: awcodes/.github/actions/install-dependencies@v1
      - run: vendor/bin/rector --dry-run

  # Single aggregate check for branch protection. `Tests` is a matrix job, so it
  # surfaces as one check per row with names that change whenever the matrix does —
  # it cannot be required by name across packages. This job can: it is one stable
  # check, `<caller-job-id> / All Checks`, regardless of matrix shape.
  #
  # A job disabled via its `run-*` input reports `skipped`, which counts as a pass.
  # `failure` and `cancelled` do not.
  all-checks:
    name: All Checks
    if: ${{ always() }}
    needs: [tests, lint, static-analysis, reformat]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key)=\(.value.result)"
          ')
          if [ -n "$failed" ]; then
            echo "::error::Not all checks passed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All checks passed or were intentionally skipped."
